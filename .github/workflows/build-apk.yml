name: Build card rotation APK

on:
  workflow_dispatch:
    inputs:
      separate_install:
        description: "Install next to the original app (application id ends with .mine). Turn OFF only if you want the original application id."
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Apply the card rotation patch
        run: |
          set -euo pipefail
          if [ ! -f card-rotation-tab.patch ]; then
            echo "::error::card-rotation-tab.patch is missing from the repository root"
            exit 1
          fi
          git apply --check card-rotation-tab.patch
          git apply card-rotation-tab.patch
          git status --short | head -50

      - name: Application id (separate install)
        if: ${{ inputs.separate_install }}
        run: |
          set -euo pipefail
          sed -i '/^        release {/a\            applicationIdSuffix = ".mine"' app/build.gradle.kts
          grep -n 'applicationIdSuffix' app/build.gradle.kts

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${KEYSTORE_PASSWORD:-}" ]; then
            echo "Using the signing key saved in repository secrets"
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
            STORE_PASS="$KEYSTORE_PASSWORD"
            KEY_PASS="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            ALIAS="${KEY_ALIAS:-rotation}"
          else
            echo "::warning::No saved signing key. Using a temporary key for this build only. An installed copy built with a different key cannot be updated in place; it must be uninstalled first, which clears its data."
            STORE_PASS="$(openssl rand -hex 16)"
            KEY_PASS="$STORE_PASS"
            ALIAS="temporary"
            keytool -genkeypair -keystore "$KS" -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 3650 \
              -storepass "$STORE_PASS" -keypass "$KEY_PASS" -dname "CN=Temporary build key"
          fi
          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"
          {
            echo "RELEASE_STORE_FILE=$KS"
            echo "RELEASE_STORE_PASSWORD=$STORE_PASS"
            echo "RELEASE_KEY_ALIAS=$ALIAS"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASS"
          } >> local.properties

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      - name: Test the bank SMS parsers (includes the HSBC account tests)
        run: ./gradlew :parser-core:jvmTest --build-cache

      - name: Test the card rotation logic
        run: ./gradlew :app:testFdroidDebugUnitTest --tests "com.pennywiseai.tracker.domain.rotation.*" --build-cache

      - name: Keep the test reports if a test failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            parser-core/build/reports/tests/
          retention-days: 7

      # The project's own F-Droid build: every Pro feature is on. No license or payment check is changed.
      - name: Build release APK (F-Droid variant)
        run: ./gradlew :app:assembleFdroidRelease --build-cache

      - name: Make sure the APK is signed
        run: |
          set -euo pipefail
          DIR=app/build/outputs/apk/fdroid/release
          ls -la "$DIR"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          KS=$(grep '^RELEASE_STORE_FILE=' local.properties | cut -d= -f2-)
          SP=$(grep '^RELEASE_STORE_PASSWORD=' local.properties | cut -d= -f2-)
          KA=$(grep '^RELEASE_KEY_ALIAS=' local.properties | cut -d= -f2-)
          KP=$(grep '^RELEASE_KEY_PASSWORD=' local.properties | cut -d= -f2-)
          for f in "$DIR"/*.apk; do
            if "$BT/apksigner" verify "$f" >/dev/null 2>&1; then
              echo "Already signed: $f"
            else
              echo "Signing: $f"
              "$BT/apksigner" sign --ks "$KS" --ks-pass "pass:$SP" --ks-key-alias "$KA" --key-pass "pass:$KP" --out "${f%.apk}-signed.apk" "$f"
              rm "$f"
            fi
          done
          ls -la "$DIR"

      - uses: actions/upload-artifact@v4
        with:
          name: card-rotation-apk
          path: app/build/outputs/apk/fdroid/release/*.apk
          if-no-files-found: error
          retention-days: 14

