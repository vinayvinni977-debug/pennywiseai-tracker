name: Build card rotation APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Apply the card rotation patch
        run: |
          PATCH=$(ls -1 card-rotation-tab* | head -n 1)
          echo "Using $PATCH"
          git apply --check "$PATCH"
          git apply "$PATCH"

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --build-cache

      - uses: actions/upload-artifact@v4
        with:
          name: card-rotation-apk
          path: app/build/outputs/apk/standard/debug/*.apk
          retention-days: 14
